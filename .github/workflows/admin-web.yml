name: Admin web checks
on:
  push:
    paths: ['apps/admin-web/**', '.github/workflows/admin-web.yml']
  pull_request:
    paths: ['apps/admin-web/**', '.github/workflows/admin-web.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
