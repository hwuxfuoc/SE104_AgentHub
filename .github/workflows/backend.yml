name: Backend checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: se104_user
          POSTGRES_PASSWORD: se104_password
          POSTGRES_DB: se104_agenthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U se104_user -d se104_agenthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://se104_user:se104_password@localhost:5432/se104_agenthub_test?schema=public
      TEST_DATABASE_URL: postgresql://se104_user:se104_password@localhost:5432/se104_agenthub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
