services:
  # Backend Finance & API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: se104-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://se104_user:se104_password@postgres:5432/se104_agenthub?schema=public
      - JWT_SECRET=se104-agent-hub-super-secret-jwt-key-finance
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://se104_user:se104_password@postgres:5432/se104_agenthub?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

  # Shared PostgreSQL database for local backend development
  postgres:
    image: postgres:18-alpine
    container_name: se104-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: se104_user
      POSTGRES_PASSWORD: se104_password
      POSTGRES_DB: se104_agenthub
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U se104_user -d se104_agenthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata18:
